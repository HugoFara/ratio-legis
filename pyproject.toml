# Ratio Legis — déclaration de l'environnement d'exécution.
#
# Le projet n'était installable ni vérifiable : `pipeline.sh` appelait `python3`,
# quel qu'il soit. La règle § 5.2 — « le pipeline est rejouable » — ne tient pas
# si l'interpréteur qui le rejoue n'est écrit nulle part. Ce fichier ne sert pas
# à publier un paquet, il sert à dire de quoi le pipeline a besoin.

# Ce projet n'expose aucun module importable : ses points d'entrée sont des
# scripts, lancés par chemin. Sans le dire, l'installation échoue — setuptools
# tente de deviner des paquets dans une arborescence à plat et s'arrête. On le
# dit donc explicitement, pour que `pip install -e .` n'installe que ce que la
# section [project] déclare : les dépendances, et rien d'autre.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "ratio-legis"
version = "0.15.0"
description = "Graphe de provenance normative du droit français"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"

# Seule dépendance hors bibliothèque standard, et une seule chose lui est
# demandée : extraire le texte des études d'impact et des avis du Conseil d'État,
# qui n'existent qu'en PDF, en conservant les offsets exigés par le § 4.3.
dependencies = ["pymupdf>=1.24"]

# L'API n'est pas nécessaire pour construire le graphe, seulement pour le servir.
# La séparer garde vraie la phrase « une seule dépendance hors bibliothèque
# standard » là où elle compte : dans le pipeline.
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
